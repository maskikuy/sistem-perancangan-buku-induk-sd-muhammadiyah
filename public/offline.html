<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koneksi Terputus - SD Muhammadiyah Sleman</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f3f4f6;
            color: #1f2937;
            text-align: center;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 32px 24px;
            border-radius: 16px;
            max-width: 360px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: #ecfdf5;
            color: #059669;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        h2 {
            margin: 0 0 8px;
            font-size: 18px;
            color: #111827;
        }
        p {
            font-size: 13px;
            color: #6b7280;
            line-height: 1.5;
            margin: 0 0 24px;
        }
        button {
            background-color: #059669;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #047857;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📶</div>
        <h2>Koneksi Terputus</h2>
        <p>Anda sedang berada dalam mode offline. Silakan periksa jaringan internet Anda untuk memuat data Buku Induk terbaru.</p>
        <button onclick="window.location.reload()">Coba Muat Ulang</button>
    </div>
</body>
</html>
